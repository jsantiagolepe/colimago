<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página no encontrada — Colima Go</title>
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#0e1119" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
<link rel="icon" href="/img/perro-de-colima.webp" type="image/webp" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Mismos tokens que la portada (noche de feria / feria de día). */
  :root {
    color-scheme: dark;
    --suelo: #0e1119; --tinta: #f2f1ee; --tinta-suave: #bfc3cd;
    --foco: #ffc347; --sobre-foco: #151822; --linea: rgba(242,241,238,0.12);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --suelo: #f4f4f1; --tinta: #141824; --tinta-suave: #3f4554;
      --foco: #f7b52a; --sobre-foco: #141824; --linea: rgba(20,24,36,0.14);
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 32px; text-align: center;
    background: var(--suelo); color: var(--tinta);
    font-family: 'Barlow', system-ui, -apple-system, sans-serif;
  }
  .perro { display: block; width: 72px; height: 72px; margin: 0 auto 20px; }
  h1 {
    font-family: 'Shrikhand', Georgia, serif; font-weight: 400;
    font-size: clamp(30px, 7vw, 46px); line-height: 1.1; margin: 0 0 14px;
  }
  p { color: var(--tinta-suave); font-size: 17px; line-height: 1.6; margin: 0 auto 28px; max-width: 42ch; }
  a.volver {
    display: inline-block; padding: 13px 26px; border-radius: 999px;
    background: var(--foco); color: var(--sobre-foco);
    font-weight: 600; text-decoration: none; letter-spacing: .01em;
  }
  a.volver:hover { filter: brightness(1.06); }
  a.volver:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <img class="perro" src="/img/perro-de-colima.webp" alt="" width="72" height="72" />
    <h1>Aquí no hay nada</h1>
    <p>Esta página no existe en colimago.mx. Vuelve a la portada para ver las playas, los rincones naturales y las fiestas de los diez municipios de Colima.</p>
    <a class="volver" href="/">Ir a la portada</a>
  </main>
</body>
</html>
