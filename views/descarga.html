<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Descarga Colima Go en {{TIENDA}}</title>
<meta name="description" content="Playas, pueblos y fiestas de los diez municipios de Colima en una app gratuita. Descárgala para {{DISPOSITIVO}} en {{TIENDA}}." />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#0e1119" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
<link rel="icon" href="/img/perro-de-colima.webp" type="image/webp" />
<!-- Tarjeta propia para cuando el link se publica en Facebook/WhatsApp. og:url
     debe ser esta misma ruta: Facebook manda el clic de la tarjeta a og:url. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Colima Go" />
<meta property="og:locale" content="es_MX" />
<meta property="og:url" content="https://www.colimago.mx/{{RUTA}}" />
<meta property="og:title" content="Descarga Colima Go en {{TIENDA}}" />
<meta property="og:description" content="Playas, pueblos y fiestas de los diez municipios de Colima en una app gratuita para {{DISPOSITIVO}}." />
<meta property="og:image" content="https://www.colimago.mx/og-colima-go.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="El Volcán de Fuego de Colima visto desde la Laguna Carrizalillo, en Comala" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Mismos tokens que la portada y la 404 (noche de feria / feria de día). */
  :root {
    color-scheme: dark;
    --suelo: #0e1119; --tinta: #f2f1ee; --tinta-suave: #bfc3cd;
    --foco: #ffc347; --sobre-foco: #151822; --linea: rgba(242,241,238,0.12);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --suelo: #f4f4f1; --tinta: #141824; --tinta-suave: #3f4554;
      --foco: #f7b52a; --sobre-foco: #141824; --linea: rgba(20,24,36,0.14);
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 32px 16px; text-align: center;
    background: var(--suelo); color: var(--tinta);
    font-family: 'Barlow', system-ui, -apple-system, sans-serif;
  }
  .perro { display: block; width: 72px; height: 72px; margin: 0 auto 20px; }
  h1 {
    font-family: 'Shrikhand', Georgia, serif; font-weight: 400;
    font-size: clamp(28px, 7vw, 42px); line-height: 1.1; margin: 0 0 14px;
  }
  p { color: var(--tinta-suave); font-size: 17px; line-height: 1.6; margin: 0 auto 28px; max-width: 38ch; }
  a.tienda {
    display: inline-block; padding: 13px 26px; border-radius: 999px;
    background: var(--foco); color: var(--sobre-foco);
    font-weight: 600; text-decoration: none; letter-spacing: .01em;
  }
  a.tienda:hover { filter: brightness(1.06); }
  a.portada { display: block; margin-top: 22px; color: var(--tinta-suave); font-size: 15px; }
  a:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <img class="perro" src="/img/perro-de-colima.webp" alt="" width="72" height="72" />
    <h1>Abriendo {{TIENDA}}…</h1>
    <p>Si no se abre solo, toca el botón para descargar Colima Go en tu {{DISPOSITIVO}}.</p>
    <a class="tienda" id="tienda" href="{{URL_TIENDA}}">Descargar en {{TIENDA}}</a>
    <a class="portada" href="/">Ir a colimago.mx</a>
  </main>
<script>
  // Manda a la tienda y, cuando la persona vuelve al navegador, la deja en la
  // portada. replace() y no href: así esta página no queda en el historial y
  // "atrás" desde la tienda no vuelve a disparar la redirección.
  (function () {
    var tienda = document.getElementById("tienda").href;
    var irAPortada = function () { location.replace("/"); };

    // En el celular la tienda se abre como app y esta pestaña se queda atrás
    // (oculta). Al regresar a ella, a la portada.
    var seOculto = false;
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) seOculto = true;
      else if (seOculto) irAPortada();
    });
    // Regreso desde la página web de la tienda restaurada de la caché.
    window.addEventListener("pageshow", function (e) { if (e.persisted) irAPortada(); });
    // Navegadores dentro de Facebook/Instagram a veces muestran la tienda
    // encima sin ocultar la pestaña; pasado un rato, la portada queda debajo.
    setTimeout(irAPortada, 4000);

    location.replace(tienda);
  })();
</script>
</body>
</html>
